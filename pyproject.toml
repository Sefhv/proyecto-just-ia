[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "justia-mvp"
version = "0.1.0"
description = "Consultorio Jurídico Virtual con IA Responsable para el acceso a la justicia en Colombia"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sergio Fabian Hernandez Vivas"},
]
dependencies = [
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "spacy>=3.7.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.90.0",
    "pytest>=7.4.0",
]

[project.scripts]
justia = "justia.justia_mvp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"justia.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
